# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: MAIN CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_call:

jobs:
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # pnpm のバージョンは package.json の packageManager から解決される
      - name: Enable Corepack
        run: corepack enable pnpm

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "pnpm"

      # ワークスペースルートで実行し、全プロジェクトの依存を解決する
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy environment file
        run: cp .env.example .env
        working-directory: packages/frontend

      - name: Build frontend
        run: pnpm --filter frontend run build

  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable pnpm

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy environment file
        run: cp .env.example .env
        working-directory: packages/backend

      - name: Prisma generate
        run: pnpm --filter backend exec prisma generate

      - name: Build backend
        run: pnpm --filter backend run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # cache-from / cache-to type=gha は意図的に使っていない。
      # 実測 (330s) では GHA キャッシュへの書き出しだけで 210s を消費していたが、
      # node_modules を含むレイヤーが巨大でヒットもしていなかった。
      # ビルド実体は約 60s なので、キャッシュを使わない方が速い。
      #
      # 検証は Dockerfile の smoke-test ステージ内で完結するので load: false でよい。
      # イメージを docker daemon へ export/import する処理にも 58s 掛かっていた。
      - name: Build image and run smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          target: smoke-test
          push: false
          load: false

  actions-timeline:
    needs: [frontend-build, backend-build, docker-build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: Kesin11/actions-timeline@v3.2.0
