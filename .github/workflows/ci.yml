# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: MAIN CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_call:

jobs:
  frontend-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # pnpm のバージョンは package.json の packageManager から解決される
      - name: Enable Corepack
        run: corepack enable pnpm

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "pnpm"

      # ワークスペースルートで実行し、全プロジェクトの依存を解決する
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy environment file
        run: cp .env.example .env
        working-directory: packages/frontend

      - name: Build frontend
        run: pnpm --filter frontend run build

  backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable pnpm

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Copy environment file
        run: cp .env.example .env
        working-directory: packages/backend

      - name: Prisma generate
        run: pnpm --filter backend exec prisma generate

      - name: Build backend
        run: pnpm --filter backend run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: pj-todo-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # runner ステージは pnpm の hoisted な node_modules を COPY して組み立てているため、
      # ビルド成功だけでなくイメージ内で実際に解決できるかまで確認する
      - name: Smoke test image
        run: |
          docker run --rm --entrypoint sh \
            -e DB_USERNAME=ci -e DB_PASSWORD=ci -e DB_HOST=localhost \
            -e DB_PORT=5432 -e DB_DATABASE=ci -e DB_SSLMODE=disable \
            pj-todo-app:ci -c '
              set -e
              test -f packages/backend/dist/src/main.js
              test -f packages/frontend/out/index.html
              ./node_modules/.bin/prisma -v
            '

  actions-timeline:
    needs: [frontend-build, backend-build, docker-build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - uses: Kesin11/actions-timeline@v3.1.1
